<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thumbnail Taste</title>
<link rel="stylesheet" href="brand-tokens.css">
<style>
@font-face{font-family:Khand;src:url(fonts/Khand-Bold.ttf);font-weight:700}
@font-face{font-family:Hind;src:url(fonts/Hind-Regular.ttf)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--mw-background);color:var(--mw-foreground);font-family:var(--mw-font-body);overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 6px}
h1{font-family:var(--mw-font-heading);font-weight:700;font-size:30px;margin:0;letter-spacing:-.01em;line-height:1}
.mark{font-family:var(--mw-font-heading);font-weight:700;font-size:12px;letter-spacing:var(--mw-tracking-label);color:var(--mw-muted-text)}
#prog{font-size:13px;color:var(--mw-muted-text);letter-spacing:var(--mw-tracking-label);text-transform:uppercase}
.bar{width:calc(100% - 36px);max-width:484px;height:2px;background:var(--mw-border)}.bar i{display:block;height:100%;background:var(--mw-primary);width:0;transition:width .2s}
#stage{position:relative;flex:1;width:100%;max-width:520px;display:flex;align-items:center;justify-content:center;padding:12px 18px;min-height:0}
#deck{position:relative;width:min(calc(100vw - 36px),484px,calc((100vh - 210px)*9/16));width:min(calc(100vw - 36px),484px,calc((100dvh - 210px)*9/16));aspect-ratio:9/16}
.card{position:absolute;inset:0;border-radius:.75rem;overflow:hidden;background:#0a0a0a;box-shadow:0 10px 30px rgba(10,10,10,.18);touch-action:none;user-select:none;will-change:transform}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid;font-family:var(--mw-font-heading);font-weight:700;font-size:28px;letter-spacing:.08em;opacity:0;background:rgba(255,255,255,.9)}
.s-yes{left:18px;color:#0a0a0a;transform:rotate(-12deg)}.s-no{right:18px;color:#737373;transform:rotate(12deg)}.s-love{left:50%;top:auto;bottom:40px;transform:translateX(-50%);color:#0a0a0a;background:#fff}
.btns{display:flex;gap:12px;padding:6px 18px calc(18px + env(safe-area-inset-bottom))}
button{font-family:var(--mw-font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--mw-tracking-label);font-size:15px;background:transparent;color:var(--mw-primary);border:2px solid var(--mw-primary);border-radius:0;padding:12px 18px;cursor:pointer;min-width:96px}
button:hover{background:var(--mw-primary);color:var(--mw-primary-foreground)}
button.ghost{border-color:var(--mw-border);color:var(--mw-muted-text);min-width:0}
.hint{font-size:12px;color:var(--mw-muted-text);text-align:center;padding-bottom:4px}
#results{display:none;width:100%;max-width:640px;padding:10px 18px 40px}
#results h2{font-family:var(--mw-font-heading);font-size:34px;margin:10px 0 4px}
#results p{color:var(--mw-muted-text);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0 20px}
.grid div{position:relative;aspect-ratio:9/16;border-radius:.5rem;overflow:hidden}.grid img{width:100%;height:100%;object-fit:cover}
.grid span{position:absolute;left:4px;bottom:4px;background:#0a0a0a;color:#fff;font:700 11px Khand;padding:1px 6px;letter-spacing:.08em}
h3{font-family:var(--mw-font-heading);font-size:20px;margin:16px 0 0;text-transform:uppercase;letter-spacing:.05em}
textarea{width:100%;height:120px;font:13px monospace;border:1px solid var(--mw-border);padding:8px;display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#0a0a0a;color:#fff;padding:10px 18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}
</style></head><body>
<header><div><div class="mark">MAX WEBERMAN</div><h1>Thumbnail Taste</h1></div><div id="prog">0 / 0</div></header>
<div class="bar"><i id="barI"></i></div>
<main id="stage"><div id="deck"></div></main>
<div class="hint" id="hint">Swipe right = Like · left = Pass · up = Love · or use arrow keys</div>
<div class="btns" id="btns">
 <button class="mw-hover" id="bNo" aria-label="Pass">✕ Pass</button>
 <button class="mw-hover" id="bLove" aria-label="Love">★ Love</button>
 <button class="mw-hover" id="bYes" aria-label="Like">♥ Like</button>
 <button class="mw-hover ghost" id="bUndo" aria-label="Undo">↺</button>
</div>
<section id="results">
 <h2>Your Thumbnail Taste</h2>
 <p id="sum"></p>
 <div class="row"><button class="mw-hover" id="bCopy">Copy Results</button><button class="mw-hover" id="bDl">Download JSON</button><button class="mw-hover ghost" id="bBack">Keep Swiping</button><button class="mw-hover ghost" id="bReset">Start Over</button></div>
 <textarea id="fallback" readonly></textarea>
 <div id="groups"></div>
</section>
<div id="toast"></div>
<script>
const KEY="thumbswipe_v1";const $=s=>document.querySelector(s);
let CARDS=[],state;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v)return s}catch(e){}return{v:{},hist:[],started:new Date().toISOString()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const rem=()=>CARDS.filter(c=>!state.v[c.id]);
function prog(){const n=Object.keys(state.v).length;$("#prog").textContent=`${Math.min(n+1,CARDS.length)} / ${CARDS.length}`;$("#barI").style.width=100*n/CARDS.length+"%"}
function render(){
 const d=$("#deck");d.innerHTML="";const r=rem();prog();
 if(!r.length){showResults();return}
 r.slice(0,3).reverse().forEach((c,i,a)=>{const el=document.createElement("div");el.className="card";el.dataset.id=c.id;
  const depth=a.length-1-i;el.style.transform=`scale(${1-depth*.04}) translateY(${depth*10}px)`;
  el.innerHTML=`<img src="${c.img}" alt=""><div class="stamp s-yes">LIKE</div><div class="stamp s-no">PASS</div><div class="stamp s-love">LOVE</div>`;
  d.appendChild(el);if(depth===0)drag(el)});
 r.slice(3,6).forEach(c=>{new Image().src=c.img});
}
function drag(el){let sx,sy,dx=0,dy=0,on=false;
 el.onpointerdown=e=>{on=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);el.style.transition="none"};
 el.onpointermove=e=>{if(!on)return;dx=e.clientX-sx;dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
  el.querySelector(".s-yes").style.opacity=Math.max(0,dx/100);el.querySelector(".s-no").style.opacity=Math.max(0,-dx/100);el.querySelector(".s-love").style.opacity=Math.max(0,(-dy-Math.abs(dx))/100)};
 el.onpointerup=el.onpointercancel=()=>{if(!on)return;on=false;
  if(-dy>110&&-dy>Math.abs(dx))decide("L");else if(dx>100)decide("Y");else if(dx<-100)decide("N");
  else{el.style.transition="transform .2s";el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0)}}}
let busy=false;
function decide(ch){const c=rem()[0];if(!c||busy)return;busy=true;
 const el=document.querySelector(`.card[data-id="${CSS.escape(c.id)}"]`);
 if(el){el.style.transition="transform .3s ease-out,opacity .3s";el.querySelector({Y:".s-yes",N:".s-no",L:".s-love"}[ch]).style.opacity=1;
  el.style.transform=ch==="L"?"translateY(-130%)":`translateX(${ch==="Y"?140:-140}%) rotate(${ch==="Y"?20:-20}deg)`;el.style.opacity=0}
 state.v[c.id]=ch;state.hist.push(c.id);save();setTimeout(()=>{busy=false;render()},280)}
function undo(){const id=state.hist.pop();if(id){delete state.v[id];save();setView("swipe");render()}}
function setView(v){const s=v==="swipe";["#stage","#btns","#hint"].forEach(x=>$(x).style.display=s?"":"none");$("#results").style.display=s?"none":"block"}
function compact(){return{app:"thumb-swipe",date:new Date().toISOString().slice(0,10),n:Object.keys(state.v).length,of:CARDS.length,key:"L=love Y=like N=pass",r:CARDS.filter(c=>state.v[c.id]).map(c=>[c.id,state.v[c.id]])}}
function showResults(){setView("results");const g={L:[],Y:[],N:[]};CARDS.forEach(c=>{if(state.v[c.id])g[state.v[c.id]].push(c)});
 $("#sum").textContent=`${g.L.length} Love · ${g.Y.length} Like · ${g.N.length} Pass. Tap Copy Results and paste it to Scout in chat.`;
 $("#groups").innerHTML=[["L","Love"],["Y","Like"],["N","Pass"]].map(([k,n])=>`<h3>${n} (${g[k].length})</h3><div class="grid">${g[k].map(c=>`<div><img src="${c.img}" loading="lazy" alt=""><span>${n.toUpperCase()}</span></div>`).join("")}</div>`).join("")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
async function copy(){const txt=JSON.stringify(compact());
 if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(txt);toast("Results Copied!");return}catch(e){}}
 const ta=$("#fallback");ta.value=txt;ta.style.display="block";ta.focus();ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}
 toast(ok?"Results Copied!":"Select the text and copy it")}
$("#bYes").onclick=()=>decide("Y");$("#bNo").onclick=()=>decide("N");$("#bLove").onclick=()=>decide("L");$("#bUndo").onclick=undo;
$("#bCopy").onclick=copy;$("#bBack").onclick=()=>{setView("swipe");render()};
$("#bReset").onclick=()=>{if(confirm("Clear all ratings and start over?")){localStorage.removeItem(KEY);state=load();setView("swipe");render()}};
$("#bDl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(compact(),null,1)],{type:"application/json"}));a.download="thumbnail-taste-results.json";a.click()};
document.addEventListener("keydown",e=>{if($("#results").style.display==="block")return;
 if(e.key==="ArrowRight")decide("Y");else if(e.key==="ArrowLeft")decide("N");else if(e.key==="ArrowUp"){e.preventDefault();decide("L")}else if(e.key==="Backspace"||e.key==="z")undo()});
state=load();fetch("manifest.json?v=1").then(r=>r.json()).then(m=>{CARDS=m.cards;render()});
</script></body></html>
