<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="color-scheme" content="light only">
<title>Thumbnail Taste Deck</title>
<link rel="stylesheet" href="brand-tokens.css?v=3">
<style>
@font-face{font-family:Khand;src:url(fonts/Khand-Bold.ttf);font-weight:700}
@font-face{font-family:Hind;src:url(fonts/Hind-Regular.ttf)}
:root{color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--mw-foreground);font-family:var(--mw-font-body);overflow-x:hidden}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh}
.wrap{width:100%;max-width:560px;padding:0 18px}
header{display:flex;justify-content:space-between;align-items:flex-end;padding-top:2px;padding-bottom:6px}
h1{font-family:var(--mw-font-heading);font-weight:700;font-size:30px;margin:0;line-height:1}
.mark{font-family:var(--mw-font-heading);font-weight:700;font-size:12px;letter-spacing:var(--mw-tracking-label);color:var(--mw-muted-text)}
#prog{font-size:13px;color:var(--mw-muted-text);letter-spacing:var(--mw-tracking-label);text-transform:uppercase}
.bar{height:3px;background:var(--mw-border)}.bar i{display:block;height:100%;background:var(--mw-primary);width:0;transition:width .2s}
#stage{display:flex;justify-content:center;padding:10px 0}
#deck{position:relative;height:calc(100vh - 330px);height:calc(100dvh - 330px);min-height:260px;max-height:760px;aspect-ratio:9/16;max-width:100%}
.card{position:absolute;inset:0;border-radius:.75rem;overflow:hidden;background:#f5f5f5;box-shadow:0 10px 30px rgba(10,10,10,.14);touch-action:none;user-select:none;will-change:transform}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid;font-family:var(--mw-font-heading);font-weight:700;font-size:28px;letter-spacing:.08em;opacity:0;background:rgba(255,255,255,.92)}
.s-yes{left:18px;color:#15803d;transform:rotate(-12deg)}.s-no{right:18px;color:#737373;transform:rotate(12deg)}.s-may{left:50%;top:45%;transform:translateX(-50%);color:#737373}.s-love{left:50%;top:auto;bottom:40px;transform:translateX(-50%);color:#dc2626}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button,.btn{font-family:var(--mw-font-heading);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;background:#fff;color:var(--mw-primary);border:2px solid var(--mw-primary);border-radius:0;padding:10px 8px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button svg{width:16px;height:16px;flex:none}
#bNo{border-color:#a3a3a3;color:#737373}#bYes{border-color:#15803d;color:#15803d}#bLove{border-color:#dc2626;color:#dc2626}#bMay{border-color:#737373;color:#404040}
.sub{display:flex;justify-content:center;gap:8px;margin-top:8px}
.quiet{border:1px solid var(--mw-border);color:var(--mw-muted-text);font-size:13px;min-height:44px;padding:8px 14px}
.notes{display:flex;margin-top:8px}
.notes input{flex:1;min-width:0;min-height:44px;font:16px var(--mw-font-body);border:1px solid var(--mw-border);padding:8px 10px;border-radius:0;background:#fff;color:inherit}
.hint{font-size:12px;color:var(--mw-muted-text);text-align:center;padding:6px 0}
#results{display:none;padding-top:8px;padding-bottom:10px}
#results h2{font-family:var(--mw-font-heading);font-size:34px;margin:10px 0 4px}
#results p{color:var(--mw-muted-text);margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0 20px}
.grid div{position:relative;aspect-ratio:9/16;border-radius:.5rem;overflow:hidden}.grid img{width:100%;height:100%;object-fit:cover}
.grid span{position:absolute;left:4px;bottom:4px;background:#fff;color:#0a0a0a;font:700 11px Khand;padding:1px 6px;letter-spacing:.08em}
h3{font-family:var(--mw-font-heading);font-size:20px;margin:16px 0 0;text-transform:uppercase;letter-spacing:.05em}
textarea{width:100%;height:120px;font:13px monospace;border:1px solid var(--mw-border);padding:8px;display:none}
.sharerow{display:flex;justify-content:center;padding:18px 0 10px}
footer{width:100%;border-top:1px solid var(--mw-border);text-align:center;padding:16px 18px calc(16px + env(safe-area-inset-bottom));margin-top:auto}
footer a{color:var(--mw-foreground);font-family:var(--mw-font-heading);letter-spacing:var(--mw-tracking-label);text-transform:uppercase;font-size:14px;text-decoration:none;border-bottom:1px solid rgba(10,10,10,.3);display:inline-block;padding:12px 2px}
footer a:hover{border-color:#0a0a0a}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#fff;color:#0a0a0a;border:1px solid var(--mw-border);box-shadow:0 6px 18px rgba(10,10,10,.12);padding:10px 18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}
@media (min-width:900px){#deck{height:calc(100vh - 360px)}}
</style></head><body>
<div class="wrap"><a class="mw-hover" href="https://webermanapps.github.io/scout-dashboard/" style="display:inline-flex;align-items:center;min-height:44px;min-width:44px;margin-top:6px;font-family:var(--mw-font-heading);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0a0a0a;text-decoration:none">&larr; Scout Dashboard</a><header><div><div class="mark">MAX WEBERMAN</div><h1>Thumbnail Taste Deck</h1></div><div id="prog">0 / 0</div></header>
<div class="bar"><i id="barI"></i></div></div>
<main class="wrap">
<div id="swipe">
 <div id="stage"><div id="deck"></div></div>
 <div class="btns">
  <button class="mw-hover" id="bNo" aria-label="No"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg>No</button>
  <button class="mw-hover" id="bMay" aria-label="Maybe">Maybe</button>
  <button class="mw-hover" id="bLove" aria-label="Love"><svg viewBox="0 0 24 24" fill="#dc2626"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>Love</button>
  <button class="mw-hover" id="bYes" aria-label="Yes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>Yes</button>
 </div>
 <div class="notes"><input id="note" type="text" maxlength="300" placeholder="Optional note for this thumbnail" aria-label="Note for this card"></div>
 <div class="sub"><button class="mw-hover quiet" id="bUndo">Undo</button><button class="mw-hover quiet" id="bSkip">Skip</button><button class="mw-hover quiet" id="bEnd">Finish And Submit</button></div>
 <div class="hint">Right = Yes, Left = No, Up = Love, Down = Maybe</div>
</div>
<section id="results">
 <h2>Your Thumbnail Taste</h2>
 <p id="sum"></p>
 <div id="submitBox"></div>
 <div class="row"><button class="mw-hover" id="bDl">Download JSON</button><button class="mw-hover" id="bCopy">Copy Results</button><button class="mw-hover quiet" id="bBack">Keep Swiping</button><button class="mw-hover quiet" id="bReset">Start Over</button></div>
 <textarea id="fallback" readonly></textarea>
 <div id="groups"></div>
</section>
</main>
<div class="sharerow"><button class="mw-hover" id="bShare">Share</button></div>
<footer><a class="mw-hover" href="https://maxweberman.com" target="_blank" rel="noopener">Built by Max Weberman</a></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script src="submit.js"></script>
<script>
const AGENT="scout", DECK="thumbnail-taste";
const KEY="thumbswipe_v3",V2="thumbswipe_v2",V1="thumbswipe_v1";const $=s=>document.querySelector(s);
const NAMES={Y:"Yes",N:"No",M:"Maybe",L:"Love"};
let CARDS=[],state;
function migrate(o){const v={};for(const k in o.v||{}){const c=o.v[k];v[k]=c==="I"?"M":c}return{v,notes:o.notes||{},skip:[],hist:o.hist||[],started:o.started||new Date().toISOString(),migrated:true}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v)return s}catch(e){}
 for(const k of [V2,V1]){try{const o=JSON.parse(localStorage.getItem(k));if(o&&o.v){const n=migrate(o);localStorage.setItem(KEY,JSON.stringify(n));return n}}catch(e){}}
 return{v:{},notes:{},skip:[],hist:[],started:new Date().toISOString()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const rem=()=>{const r=CARDS.filter(c=>!state.v[c.id]);const s=new Set(state.skip);return r.filter(c=>!s.has(c.id)).concat(r.filter(c=>s.has(c.id)))};
const done=()=>Object.keys(state.v).length;
function prog(){const n=done();$("#prog").textContent=`${Math.min(n+1,CARDS.length)} / ${CARDS.length}`;$("#barI").style.width=100*n/CARDS.length+"%"}
function render(){const d=$("#deck");d.innerHTML="";const r=rem();prog();$("#note").value="";
 if(!r.length){showResults();return}
 r.slice(0,3).reverse().forEach((c,i,a)=>{const el=document.createElement("div");el.className="card";el.dataset.id=c.id;
  const depth=a.length-1-i;el.style.transform=`scale(${1-depth*.04}) translateY(${depth*10}px)`;
  el.innerHTML=`<img src="${c.img}" alt="Thumbnail ${c.id}"><div class="stamp s-yes">YES</div><div class="stamp s-no">NO</div><div class="stamp s-love">LOVE</div><div class="stamp s-may">MAYBE</div>`;
  d.appendChild(el);if(depth===0)drag(el)});
 r.slice(3,6).forEach(c=>{new Image().src=c.img})}
function drag(el){let sx,sy,dx=0,dy=0,on=false;const st=s=>el.querySelector(s).style;
 el.onpointerdown=e=>{on=true;dx=dy=0;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);el.style.transition="none"};
 el.onpointermove=e=>{if(!on)return;dx=e.clientX-sx;dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
  st(".s-yes").opacity=Math.max(0,dx/100);st(".s-no").opacity=Math.max(0,-dx/100);st(".s-love").opacity=Math.max(0,(-dy-Math.abs(dx))/100);st(".s-may").opacity=Math.max(0,(dy-Math.abs(dx))/100)};
 el.onpointerup=el.onpointercancel=()=>{if(!on)return;on=false;
  if(-dy>110&&-dy>Math.abs(dx))decide("L");else if(dy>110&&dy>Math.abs(dx))decide("M");else if(dx>100)decide("Y");else if(dx<-100)decide("N");
  else{el.style.transition="transform .2s";el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0)}}}
let busy=false;
function decide(ch){const c=rem()[0];if(!c||busy)return;busy=true;
 const el=document.querySelector(`.card[data-id="${CSS.escape(c.id)}"]`);
 if(el){el.style.transition="transform .3s ease-out,opacity .3s";el.querySelector({Y:".s-yes",N:".s-no",L:".s-love",M:".s-may"}[ch]).style.opacity=1;
  el.style.transform=ch==="L"?"translateY(-130%)":ch==="M"?"translateY(130%)":`translateX(${ch==="Y"?140:-140}%) rotate(${ch==="Y"?20:-20}deg)`;el.style.opacity=0}
 const n=$("#note").value.trim();if(n)state.notes[c.id]=n;else delete state.notes[c.id];
 state.v[c.id]=ch;state.skip=state.skip.filter(x=>x!==c.id);state.hist.push(c.id);save();setTimeout(()=>{busy=false;render()},280)}
function skip(){const c=rem()[0];if(!c)return;state.skip=state.skip.filter(x=>x!==c.id).concat(c.id);save();render()}
function undo(){const id=state.hist.pop();if(id){delete state.v[id];save();setView("swipe");render();$("#note").value=state.notes[id]||""}}
function setView(v){const s=v==="swipe";$("#swipe").style.display=s?"":"none";$("#results").style.display=s?"none":"block"}
function payload(){return{app:"thumb-swipe",deck:"Thumbnail Taste Deck",deck_id:DECK,agent:AGENT,version:3,submitted_at:new Date().toISOString(),n:done(),of:CARDS.length,
 key:"L=love Y=yes M=maybe N=no",r:CARDS.filter(c=>state.v[c.id]).map(c=>state.notes[c.id]?[c.id,state.v[c.id],state.notes[c.id]]:[c.id,state.v[c.id]])}}
function showResults(){setView("results");const g={L:[],Y:[],M:[],N:[]};CARDS.forEach(c=>{if(state.v[c.id])g[state.v[c.id]].push(c)});
 const left=CARDS.length-done();
 $("#sum").textContent=`${g.L.length} Love, ${g.Y.length} Yes, ${g.M.length} Maybe, ${g.N.length} No`+(left?`, ${left} not rated yet.`:".")+" Tap Submit to send it to Scout.";
 $("#groups").innerHTML=[["L","Love"],["Y","Yes"],["M","Maybe"],["N","No"]].map(([k,n])=>`<h3>${n} (${g[k].length})</h3><div class="grid">${g[k].map(c=>`<div><img src="${c.img}" loading="lazy" alt=""><span>${n.toUpperCase()}</span></div>`).join("")}</div>`).join("");
}
function download(p){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,1)],{type:"application/json"}));a.download=`thumbnail-taste-deck-results-${p.submitted_at.slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove()}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
async function copy(){const txt=JSON.stringify(payload());
 if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(txt);toast("Results Copied");return}catch(e){}}
 const ta=$("#fallback");ta.value=txt;ta.style.display="block";ta.focus();ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}toast(ok?"Results Copied":"Select the text and copy it")}
async function share(){const url=location.href.split("#")[0];if(navigator.share){try{await navigator.share({title:"Thumbnail Taste Deck",url});return}catch(e){if(e.name==="AbortError")return}}
 try{await navigator.clipboard.writeText(url);toast("Link Copied")}catch(e){toast(url)}}
$("#bYes").onclick=()=>decide("Y");$("#bNo").onclick=()=>decide("N");$("#bLove").onclick=()=>decide("L");$("#bMay").onclick=()=>decide("M");
$("#bUndo").onclick=undo;$("#bSkip").onclick=skip;$("#bEnd").onclick=showResults;$("#bShare").onclick=share;
$("#bCopy").onclick=copy;$("#bBack").onclick=()=>{setView("swipe");render()};$("#bDl").onclick=()=>download(payload());
$("#bReset").onclick=()=>{if(confirm("Clear all ratings and start over?")){localStorage.removeItem(KEY);localStorage.removeItem(V2);localStorage.removeItem(V1);state=load();setView("swipe");render()}};
document.addEventListener("keydown",e=>{if($("#results").style.display==="block"||e.target.tagName==="INPUT")return;
 if(e.key==="ArrowRight")decide("Y");else if(e.key==="ArrowLeft")decide("N");else if(e.key==="ArrowUp"){e.preventDefault();decide("L")}else if(e.key==="ArrowDown"){e.preventDefault();decide("M")}else if(e.key==="s")skip();else if(e.key==="Backspace"||e.key==="z")undo()});
MWSubmit.button(document.getElementById("submitBox"),{agent:"scout",app:"thumbnail-taste",deck:"Thumbnail Taste Deck",
 getResults:()=>{const p=payload();try{localStorage.setItem("thumbswipe_v3_lastpayload",JSON.stringify(p))}catch(e){}return p},
 getNotes:()=>Object.entries(state.notes||{}).map(([k,v])=>k+": "+v).join("\n")});
state=load();state.notes=state.notes||{};state.skip=state.skip||[];
fetch("manifest.json?v=3").then(r=>r.json()).then(m=>{CARDS=m.cards;render()});
</script></body></html>
